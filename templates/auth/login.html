<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — RecruitAI</title>
  <meta name="description" content="Sign in to your RecruitAI account to start AI-powered resume screening." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg-base);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(79,142,247,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(167,139,250,0.08) 0%, transparent 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2.5rem 2.25rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(79,142,247,0.06);
      animation: slideUp 0.45s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }
    .auth-logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 24px rgba(79,142,247,0.35);
    }
    .auth-logo-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--text-primary); }
    .auth-title  { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.65rem; color: var(--text-primary); margin-bottom: 0.35rem; }
    .auth-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
    .form-label-custom { color: var(--text-secondary); font-size: 0.82rem; font-weight: 500; margin-bottom: 0.4rem; letter-spacing: 0.02em; }
    .form-control-custom {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      color: var(--text-primary);
      padding: 0.7rem 1rem;
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .form-control-custom:focus {
      outline: none;
      background: rgba(255,255,255,0.07);
      border-color: rgba(79,142,247,0.5);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
      color: var(--text-primary);
    }
    .form-control-custom::placeholder { color: var(--text-muted); }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .bi { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; pointer-events: none; }
    .input-icon-wrap .form-control-custom { padding-left: 2.4rem; }
    .btn-auth {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.22s;
      box-shadow: 0 4px 20px rgba(79,142,247,0.3);
      margin-top: 0.5rem;
    }
    .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(79,142,247,0.45); }
    .auth-divider { text-align: center; color: var(--text-muted); font-size: 0.82rem; margin: 1.25rem 0; position: relative; }
    .auth-divider::before, .auth-divider::after {
      content: ''; position: absolute; top: 50%; width: 40%; height: 1px;
      background: rgba(255,255,255,0.07);
    }
    .auth-divider::before { left: 0; }
    .auth-divider::after  { right: 0; }
    .auth-link { color: var(--primary); text-decoration: none; font-weight: 500; }
    .auth-link:hover { color: var(--accent); text-decoration: underline; }
    .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; }
    .remember-row input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; }
    .remember-row label { color: var(--text-secondary); font-size: 0.87rem; margin: 0; }
    .flash-area { margin-bottom: 1.25rem; }
    .alert-custom {
      border-radius: 12px; font-size: 0.88rem; padding: 0.7rem 1rem;
      border: 1px solid transparent;
    }
    .alert-success { background: rgba(16,217,160,0.1); border-color: rgba(16,217,160,0.25); color: #10d9a0; }
    .alert-danger  { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.25); color: #f87171; }
    .alert-warning { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.25); color: #fbbf24; }
    .alert-info    { background: rgba(79,142,247,0.1); border-color: rgba(79,142,247,0.25); color: #4f8ef7; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="bi bi-cpu-fill" style="color:#fff"></i></div>
      <span class="auth-logo-text">RecruitAI</span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue.</p>

    <!-- Flash messages -->
    <div class="flash-area">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-custom alert-{{ 'danger' if category == 'error' else category }}">
              <i class="bi bi-{{ 'check-circle-fill' if category == 'success' else 'exclamation-triangle-fill' }} me-1"></i>
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <div class="mb-3">
        <label class="form-label-custom" for="email">Email address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope-fill"></i>
          <input type="email" id="email" name="email" class="form-control-custom"
                 placeholder="you@company.com" required autocomplete="email" />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label-custom" for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="password" name="password" class="form-control-custom"
                 placeholder="••••••••" required autocomplete="current-password" />
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="remember" name="remember" value="1" />
        <label for="remember">Remember me for 30 days</label>
      </div>

      <button type="submit" class="btn-auth">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
      </button>
    </form>

    <div class="auth-divider">or</div>
    <p style="text-align:center; color:var(--text-secondary); font-size:0.88rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}" class="auth-link">Create one free</a>
    </p>

  </div>
</div>
</body>
</html>
